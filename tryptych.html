<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triptych Poster | Ancient Asian Warriors Project</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Serif JP", serif;
        background: linear-gradient(135deg, #e6ceb2 0%, #d4b896 100%);
        color: #333;
        line-height: 1.6;
        overflow-x: hidden;
      }

      nav {
        background: linear-gradient(90deg, #8b0000, #a50000);
        padding: 20px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin: 0 25px;
        font-weight: 500;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        position: relative;
        padding: 10px 0;
      }

      nav a::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 2px;
        background: white;
        transition: all 0.3s ease;
        transform: translateX(-50%);
      }

      nav a:hover {
        transform: translateY(-2px);
        text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
      }

      nav a:hover::after {
        width: 100%;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      /* Main Triptych Layout */
      .triptych-container {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        margin: 60px 0;
        gap: 15px;
        min-height: 500px;
      }

      .triptych-panel {
        position: relative;
        width: 300px;
        height: 450px;
        border: 3px solid #8b0000;
        border-radius: 15px;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        background: linear-gradient(45deg, #f0e8d8, #e6ceb2);
        transform-origin: center;
      }

      .triptych-panel:hover {
        transform: scale(1.05) translateY(-10px);
        z-index: 10;
        box-shadow: 0 20px 50px rgba(139, 0, 0, 0.4);
      }

      .panel-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: all 0.4s ease;
        filter: sepia(20%) contrast(1.1);
      }

      .triptych-panel:hover .panel-image {
        filter: sepia(0%) contrast(1.2) brightness(1.1);
        transform: scale(1.05);
      }

      .panel-content {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(transparent, rgba(139, 0, 0, 0.9));
        color: white;
        padding: 20px;
        transform: translateY(60px);
        transition: all 0.4s ease;
      }

      .triptych-panel:hover .panel-content {
        transform: translateY(0);
      }

      .panel-title {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 8px;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
      }

      .panel-description {
        font-size: 0.9rem;
        opacity: 0.9;
        line-height: 1.4;
      }

      /* Mockup Section */
      .mockup-section {
        margin: 80px 0 60px 0;
      }

      .mockup-title {
        text-align: center;
        color: #8b0000;
        font-size: 2.2rem;
        font-weight: 700;
        margin-bottom: 40px;
        position: relative;
      }

      .mockup-title::after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 3px;
        background: #8b0000;
        border-radius: 2px;
      }

      .mockup-container {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 40px;
        margin: 40px 0;
      }

      .mockup-panel {
        position: relative;
        width: 400px;
        height: 300px;
        border: 3px solid #a50000;
        border-radius: 15px;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        background: linear-gradient(135deg, #f5f0e8, #ebe2d6);
        transform-origin: center;
      }

      .mockup-panel:hover {
        transform: scale(1.08) translateY(-8px);
        box-shadow: 0 15px 40px rgba(165, 0, 0, 0.4);
        border-color: #8b0000;
      }

      .mockup-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: all 0.4s ease;
        filter: sepia(15%) contrast(1.05);
      }

      .mockup-panel:hover .mockup-image {
        filter: sepia(0%) contrast(1.15) brightness(1.08);
        transform: scale(1.03);
      }

      .mockup-content {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(transparent, rgba(165, 0, 0, 0.85));
        color: white;
        padding: 15px;
        transform: translateY(40px);
        transition: all 0.4s ease;
      }

      .mockup-panel:hover .mockup-content {
        transform: translateY(0);
      }

      .mockup-content h3 {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 10px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
      }

      .mockup-content p {
        font-size: 0.85rem;
        opacity: 0.95;
        line-height: 1.3;
      }

      /* Fullscreen Modal with Slider */
      .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(5px);
      }

      .modal-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 90vw;
        max-height: 90vh;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      .modal-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        max-height: 90vh;
        max-width: 90vw;
      }

      .close {
        position: absolute;
        top: 20px;
        right: 30px;
        color: white;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        z-index: 10001;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        transition: all 0.3s ease;
      }

      .close:hover {
        color: #ff6b6b;
        transform: scale(1.1);
      }

      /* Navigation Arrows */
      .nav-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(139, 0, 0, 0.8);
        color: white;
        border: none;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        z-index: 10001;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav-arrow:hover {
        background: rgba(139, 0, 0, 1);
        transform: translateY(-50%) scale(1.1);
        box-shadow: 0 5px 20px rgba(139, 0, 0, 0.5);
      }

      .nav-arrow:active {
        transform: translateY(-50%) scale(0.95);
      }

      .nav-arrow.prev {
        left: 30px;
      }

      .nav-arrow.next {
        right: 30px;
      }

      /* Image Counter */
      .image-counter {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 16px;
        z-index: 10001;
      }

      /* Design Rationale Section */
      .design-rationale {
        background: linear-gradient(135deg, #f0e8d8, #faf5ef);
        border-radius: 20px;
        padding: 50px;
        margin: 60px 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }

      .design-rationale::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, #8b0000, #a50000, #8b0000);
      }

      /* Footer */
      footer {
        background: linear-gradient(135deg, #333, #2a2a2a);
        color: white;
        text-align: center;
        padding: 30px;
        margin-top: 60px;
        position: relative;
        overflow: hidden;
      }

      footer::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
        animation: shine 3s infinite;
      }

      @keyframes shine {
        0% {
          left: -100%;
        }
        100% {
          left: 100%;
        }
      }

      footer p {
        font-size: 1.1rem;
        font-weight: 300;
        position: relative;
        z-index: 1;
      }

      /* Responsive Design */
      @media (max-width: 1024px) {
        .triptych-container {
          flex-direction: column;
          align-items: center;
          gap: 30px;
        }

        .triptych-panel {
          width: 90%;
          max-width: 400px;
        }

        .mockup-container {
          flex-direction: column;
          align-items: center;
          gap: 30px;
        }

        .mockup-panel {
          width: 90%;
          max-width: 450px;
        }

        .design-rationale {
          padding: 30px;
          margin: 40px 0;
        }

        .design-rationale h2 {
          font-size: 2rem;
        }

        .nav-arrow {
          width: 50px;
          height: 50px;
          font-size: 20px;
        }

        .nav-arrow.prev {
          left: 20px;
        }

        .nav-arrow.next {
          right: 20px;
        }
      }

      @media (max-width: 768px) {
        nav a {
          margin: 0 15px;
          font-size: 1rem;
        }

        .container {
          padding: 20px 15px;
        }

        .triptych-panel,
        .mockup-panel {
          width: 95%;
        }

        .mockup-title {
          font-size: 1.8rem;
        }

        .design-rationale {
          padding: 25px;
        }

        .design-rationale h2 {
          font-size: 1.8rem;
        }

        .design-rationale p {
          font-size: 1rem;
        }

        .nav-arrow {
          width: 45px;
          height: 45px;
          font-size: 18px;
        }

        .nav-arrow.prev {
          left: 15px;
        }

        .nav-arrow.next {
          right: 15px;
        }

        .close {
          font-size: 35px;
          top: 15px;
          right: 20px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="character.html">character</a>
      <a href="timeline.html">India Timeline</a>
    </nav>

    <div class="container">
      <h2 class="mockup-title">Triptych</h2>
      <!-- Main Triptych Section -->
      <section class="triptych-container">
        <div class="triptych-panel" onclick="openModal(0)">
          <img
            src="Artboard 1.png"
            alt="Ancient Warrior - Past"
            class="panel-image"
          />
          <div class="panel-content">
            <div class="panel-title">Joy</div>
          </div>
        </div>

        <div class="triptych-panel" onclick="openModal(1)">
          <img
            src="Artboard 1 copy.png"
            alt="Modern Connection - Present"
            class="panel-image"
          />
          <div class="panel-content">
            <div class="panel-title">Emotional suppression</div>
          </div>
        </div>

        <div class="triptych-panel" onclick="openModal(2)">
          <img
            src="Artboard 1 copy 2.png"
            alt="Future Vision - Future"
            class="panel-image"
          />
          <div class="panel-content">
            <div class="panel-title">Sadness</div>
          </div>
        </div>
      </section>

      <!-- Mockup Section -->
      <section class="mockup-section">
        <h2 class="mockup-title">Triptych Mockups</h2>
        <div class="mockup-container">
          <div class="mockup-panel" onclick="openModal(3)">
            <img
              src="Billboard_on_Damaged_Wall.jpg"
              alt="Triptych Poster Mockup 1"
              class="mockup-image"
            />
            <div class="mockup-content">
              <h3>Gallery Display</h3>
              <p>Triptych mockup design in billboard setting</p>
            </div>
          </div>

          <div class="mockup-panel" onclick="openModal(4)">
            <img
              src="FULL-TRYPTCH-2.png"
              alt="Triptych Poster Mockup 2"
              class="mockup-image"
            />
            <div class="mockup-content">
              <h3>Gallery Display</h3>
              <p>Tryptych mockup in poster form</p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Modal with Slider -->
    <div id="imageModal" class="modal" onclick="closeModal()">
      <span class="close" onclick="closeModal()">&times;</span>
      <button
        class="nav-arrow prev"
        onclick="event.stopPropagation(); previousImage()"
      >
        ‹
      </button>
      <button
        class="nav-arrow next"
        onclick="event.stopPropagation(); nextImage()"
      >
        ›
      </button>
      <div class="modal-content">
        <img id="modalImage" src="" alt="" class="modal-image" />
      </div>
      <div class="image-counter">
        <span id="currentImageNumber">1</span> / <span id="totalImages">5</span>
      </div>
    </div>

    <footer>
      <p>
        &copy; 2025 Ancient Asian Warriors Project | Creative Media Design
        Literacy 2
      </p>
    </footer>

    <script>
      // Image gallery data
      const images = [
        {
          src: "Artboard 1.png",
          alt: "Joy - Ancient Warrior Past",
          title: "Joy",
        },
        {
          src: "Artboard 1 copy.png",
          alt: "Emotional suppression - Modern Connection Present",
          title: "Emotional suppression",
        },
        {
          src: "Artboard 1 copy 2.png",
          alt: "Sadness - Future Vision Future",
          title: "Sadness",
        },
        {
          src: "Billboard_on_Damaged_Wall.jpg",
          alt: "Gallery Display - Triptych Poster Mockup 1",
          title: "Gallery Display - Billboard",
        },
        {
          src: "FULL-TRYPTCH-2.png",
          alt: "Gallery Display - Triptych Poster Mockup 2",
          title: "Gallery Display - Poster",
        },
      ];

      let currentImageIndex = 0;

      function openModal(imageIndex) {
        currentImageIndex = imageIndex;
        const modal = document.getElementById("imageModal");
        const modalImage = document.getElementById("modalImage");
        const currentImageNumber =
          document.getElementById("currentImageNumber");
        const totalImages = document.getElementById("totalImages");

        modalImage.src = images[currentImageIndex].src;
        modalImage.alt = images[currentImageIndex].alt;
        currentImageNumber.textContent = currentImageIndex + 1;
        totalImages.textContent = images.length;

        modal.style.display = "block";
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        const modal = document.getElementById("imageModal");
        modal.style.display = "none";
        document.body.style.overflow = "auto";
      }

      function nextImage() {
        currentImageIndex = (currentImageIndex + 1) % images.length;
        updateModalImage();
      }

      function previousImage() {
        currentImageIndex =
          (currentImageIndex - 1 + images.length) % images.length;
        updateModalImage();
      }

      function updateModalImage() {
        const modalImage = document.getElementById("modalImage");
        const currentImageNumber =
          document.getElementById("currentImageNumber");

        modalImage.src = images[currentImageIndex].src;
        modalImage.alt = images[currentImageIndex].alt;
        currentImageNumber.textContent = currentImageIndex + 1;
      }

      // Keyboard navigation
      document.addEventListener("keydown", function (event) {
        const modal = document.getElementById("imageModal");
        if (modal.style.display === "block") {
          if (event.key === "Escape") {
            closeModal();
          } else if (event.key === "ArrowRight") {
            nextImage();
          } else if (event.key === "ArrowLeft") {
            previousImage();
          }
        }
      });

      // Close modal when clicking outside the image
      window.onclick = function (event) {
        const modal = document.getElementById("imageModal");
        if (event.target === modal) {
          closeModal();
        }
      };

      // Touch support for mobile swipe
      let startX = 0;
      let startY = 0;

      document.addEventListener("touchstart", function (event) {
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
      });

      document.addEventListener("touchend", function (event) {
        const modal = document.getElementById("imageModal");
        if (modal.style.display === "block") {
          const endX = event.changedTouches[0].clientX;
          const endY = event.changedTouches[0].clientY;
          const diffX = startX - endX;
          const diffY = startY - endY;

          // Only trigger if horizontal swipe is greater than vertical
          if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
            if (diffX > 0) {
              nextImage(); // Swipe left to go to next image
            } else {
              previousImage(); // Swipe right to go to previous image
            }
          }
        }
      });
    </script>
  </body>
</html>
